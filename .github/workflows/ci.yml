name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]" types-PyYAML
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest

# Entscheidungssystem — deine Einstellungen.
# Kopiere diese Datei nach config/decide.yaml und trage deine Zahlen ein.
# config/decide.yaml ist git-ignoriert.

# Startkapital. In der Paper-Phase ein gedachter Betrag — nimm den, mit dem du
# später wirklich anfangen würdest, sonst üben die Positionsgrößen etwas
# anderes, als du später tust.
starting_capital: "1000"

# Gebührensatz deiner Börse als BRUCHTEIL. 0,26 % sind 0.0026, nicht 0.26.
# Nachschlagen, nicht schätzen — diese Zahl entscheidet mit, ob ein Setup
# überhaupt handelbar ist.
fee_rate: "0.0026"

# Kleinster Auftrag, den die Börse annimmt, in Quote-Währung.
min_notional: "10"

symbol: "BTCUSD"

# --- Risiko (Standardwerte sind bewusst konservativ) ---
# Anteil des Kapitals, den ein einzelner Trade riskieren darf.
risk_per_trade: "0.01"
# Tagesverlust, ab dem keine neuen Trades mehr erlaubt sind.
daily_loss_limit: "0.03"
# Drawdown vom Höchststand, ab dem alles anhält.
max_drawdown: "0.15"
# Obergrenze für eine Position, unabhängig vom Stop-Abstand.
max_position_fraction: "0.25"

max_open_positions: 3

# Mindest-Chance-Risiko-Verhältnis. Bei 1.0 zahlt das Ziel genau das, was du
# riskierst — dafür bräuchtest du über 50 % Trefferquote. Trendfolge hat 35-45 %.
# Die übliche Empfehlung von 1.5 bis 2.0 kommt genau daher.
min_reward_to_risk: "1.5"

# Zeit-Stop: Position nach so vielen Kerzen schliessen, egal wo der Kurs steht.
# Leer lassen (auskommentieren) schaltet ihn ab.
#
# 12 ist VORAB festgelegt, bevor die Papier-Phase beginnt — nicht nachträglich
# passend gemacht. Die Messung in docs/REAL_DATA_REPORT.md: der Donchian-Ausstieg
# wartet auf ein 20-Tage-Tief und gibt den Gewinn dabei groesstenteils zurueck.
# Ein Zeit-Stop von 5 bis 15 Kerzen war auf allen drei Maerkten gleichzeitig
# positiv, und 10 bis 15 auch in beiden Haelften der Reihe — in einem Markt, der
# um 80 bis 99 % stieg, und in einem, der um 32 bis 57 % fiel.
#
# Warum 12 und nicht 10, obwohl 10 im Test am besten war: der beste Wert eines
# Durchlaufs ist das Maximum einer Zufallsziehung. Aus einem breiten guten
# Bereich nimmt man die Mitte. Wer den Bestwert nimmt, waehlt die Ueberanpassung.
#
# Das ist eine HYPOTHESE, kein Ergebnis: 27 Trades, Schwelle sind 30. Die
# Papier-Phase misst sie — sie bestaetigt sie nicht.
time_stop_bars: 12

# Auf true erst, wenn ALLE vier Bedingungen aus docs/ANLEITUNG.md erfüllt sind.
# Der Wert ändert keine einzige Prüfung — er wird nur im Journal festgehalten,
# damit Papier- und Echtgeld-Ergebnisse nie vermischt werden.
real_money: false

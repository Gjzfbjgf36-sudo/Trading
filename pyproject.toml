[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbcore"
version = "0.1.0"
description = "Multi-market crypto arbitrage research platform (research / paper trading only)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arbcore"]

# ccxt is an optional dependency: the system evaluates rules from CSV without
# it, and only the live download needs it. Absent stubs must not fail the type
# check for everyone who never installs it.
[[tool.mypy.overrides]]
module = "ccxt.*"
ignore_missing_imports = true
